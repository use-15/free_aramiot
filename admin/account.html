<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARAMIOT Admin — Account</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <header class="admin-topbar">
      <a class="admin-topbar-brand" href="/admin">
        <span class="mark" aria-hidden="true">A</span>
        <span>ARAMIOT Admin</span>
      </a>
      <nav class="admin-topbar-nav" aria-label="Admin sections">
        <a class="nav-link" href="/admin/dashboard.html">Dashboard</a>
        <a class="nav-link" href="/admin/pages.html">Pages</a>
        <a class="nav-link" href="/admin/articles.html">Articles</a>
        <a class="nav-link" href="/admin/categories.html">Categories</a>
        <a class="nav-link" href="/admin/projects.html">Projects</a>
        <a class="nav-link" href="/admin/programs.html">Programs</a>
        <a class="nav-link" href="/admin/team.html">Team</a>
        <a class="nav-link" href="/admin/publications.html">Publications</a>
        <a class="nav-link" href="/admin/resources.html">Resources</a>
        <a class="nav-link" href="/admin/impact.html">Impact</a>
        <a class="nav-link" href="/admin/messages.html">Messages</a>
        <a class="nav-link" href="/admin/applications.html">Applications</a>
        <a class="nav-link" href="/admin/inquiries.html">Inquiries</a>
        <a class="nav-link" href="/admin/organization.html">Organization</a>
        <a class="nav-link active" href="/admin/website-settings.html">Site settings</a>
      </nav>
      <div class="admin-topbar-user">
        <span id="topbar-loading" class="admin-spinner" aria-hidden="true"></span>
        <span class="admin-hide" id="topbar-signed-out">
          <a class="btn-admin btn-admin--secondary" href="/admin/login">Sign in</a>
        </span>
      </div>
    </header>

    <main class="admin-body">
      <div class="admin-container">
        <div class="admin-alert admin-alert--error admin-hide" id="page-alert" role="alert"></div>

        <div class="admin-page-header">
          <div>
            <h1 class="admin-page-title">Account</h1>
            <p class="admin-page-sub">Your Super Admin account: email, active status and password.</p>
          </div>
          <a class="btn-admin btn-admin--secondary" href="/admin/dashboard.html">Back to dashboard</a>
        </div>

        <div class="admin-card">
          <div class="admin-card-header">
            <h2 class="admin-card-title">Your account</h2>
            <span class="badge-id" id="account-id"></span>
          </div>
          <div class="admin-card-body" id="loading">
            <div class="empty-state"><span class="admin-spinner" aria-hidden="true"></span><p class="mb-0 mt-2">Loading account…</p></div>
          </div>
          <div class="admin-card-body admin-hide" id="form-container"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    window.ARAMIOT_ADMIN_CONFIG = {
      API_BASE_URL: window.location.origin + '/api/admin',
      REQUEST_TIMEOUT_MS: 15000,
    };
  </script>
  <script src="/admin/assets/js/admin-api.js"></script>
  <script src="/admin/assets/js/admin-settings.js" defer></script>
  <script>
    (function (global) {
      'use strict';
      var win = global.window;
      var doc = win.document;
      var ARAMIOT = global.ARAMIOT_ADMIN || {};
      var api = ARAMIOT.api;
      var settings = ARAMIOT.settings;

      function showAlert(message, kind) {
        var alertEl = doc.getElementById('page-alert');
        if (!alertEl) return;
        alertEl.textContent = message;
        alertEl.className = 'admin-alert admin-alert--' + (kind || 'error') + ' admin-hide';
        alertEl.classList.remove('admin-hide');
        setTimeout(function () { alertEl.classList.add('admin-hide'); }, 6000);
      }

      function showLoading(show) {
        var loading = doc.getElementById('loading');
        var form = doc.getElementById('form-container');
        var idEl = doc.getElementById('account-id');
        if (!loading || !form) return;
        if (show) {
          loading.classList.remove('admin-hide');
          form.classList.add('admin-hide');
          if (idEl) idEl.textContent = '';
        } else {
          loading.classList.add('admin-hide');
          form.classList.remove('admin-hide');
        }
      }

      window.ARAMIOT_ADMIN.account = {
        loadProfile: function () {
          showLoading(true);
          ensureReady()
            .then(function () { return api.account(); })
            .then(function (res) {
              showLoading(false);
              var admin = res && res.data;
              if (!admin) {
                showAlert('Account not found.', 'error');
                return;
              }
              if (idEl) idEl.textContent = 'ID: ' + (admin._id || '');
              var container = doc.getElementById('form-container');
              settings.renderAccountForm(container, admin);
            })
            .catch(function (err) {
              showLoading(false);
              if (err && err.status === 401) { win.location.href = '/admin/login'; return; }
              showAlert((err && err.message) || 'Could not load account.', 'error');
            });
        },
      };

      function ensureReady() {
        return api.refreshCsrf().then(function () {
          return api.session();
        }).then(function (session) {
          if (!session || session.data.authenticated !== true) {
            throw { status: 401 };
          }
          return session;
        });
      }

      if (doc.readyState === 'loading') {
        doc.addEventListener('DOMContentLoaded', function () {
          window.ARAMIOT_ADMIN.account.loadProfile();
        });
      } else {
        window.ARAMIOT_ADMIN.account.loadProfile();
      }
    })(typeof window !== 'undefined' ? window : this);
  </script>
</body>
</html>
